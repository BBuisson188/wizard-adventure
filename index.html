<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wizard Adventures" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#101735" />
  <title>Wizard Adventures - Moonstone Meadow</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="shortcut icon" href="assets/icons/favicon.ico" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="game-card">
      <div class="topbar">
        <div>
          <h1>Wizard Adventures</h1>
          <p>Moonstone Meadow: five levels and a boss</p>
        </div>
        <button id="pauseButton" class="topbar-button" type="button" disabled>Pause</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="540" aria-label="Wizard Adventures Moonstone Meadow game canvas"></canvas>
        <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Enter full screen">Full Screen</button>
        <div id="touchControls" class="touch-controls standard on-title" aria-label="Touch controls">
          <div class="touch-dpad" aria-label="Movement buttons">
            <button class="touch-btn dpad-btn up" data-key="ArrowUp" data-touch="up" aria-label="Up">▲</button>
            <button class="touch-btn dpad-btn left" data-key="ArrowLeft" data-touch="left" aria-label="Left">◀</button>
            <button class="touch-btn dpad-btn right" data-key="ArrowRight" data-touch="right" aria-label="Right">▶</button>
            <button class="touch-btn dpad-btn down" data-key="ArrowDown" data-touch="down" aria-label="Down">▼</button>
          </div>
          <div class="touch-actions" aria-label="Action buttons">
            <button class="touch-btn action-btn button-b" data-key="KeyX" data-touch="buttonB" aria-label="B button">B</button>
            <button class="touch-btn action-btn button-a" data-key="Space" data-touch="buttonA" aria-label="A button">A</button>
          </div>
        </div>
        <div id="loading" class="overlay">Loading Moonstone Meadow...</div>
      </div>
    </section>
  </main>
  <script src="src/level1-data.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
